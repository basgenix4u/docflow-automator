    <script>
function swapcontent(cv,v,a,b,c,d,e,f,g,h,i,j,k,l)
{   //swap content begins where cv means div id name
	var divid="#"+cv;//"#lga", {contentvar:cv,state:v}
	$(divid).html('<img src="images/loader.gif" width="100" height="100" alt="loading">').show();
	var url="scriptfile_a.php";
	var str;
	
	
 if(cv=='main_login') //start putme_login
  {
	  //alert(cv+" "+v+" "+a);exit();
	  //alert($("form").serialize());exit();
	  if(v=="" || a=="")
			{
				alert('Your Login ID and Password are compulsory');
				$(divid).html('').show();  //stop loader from rolling
				exit();
			}
		$.post(url,$("form").serialize()+"&contentvar="+cv,function(data){  //ajaxfile/scriptfile_a is called undernith
		$(divid).html(data).show(); //report result from the ajaxfile, the data stores the information to be displayed from ajaxfile
		
		});
  }//end of putme_login
  
  
  if(cv=='dialog') //start dialog display
  {
	    ShowDialog(true);
		$.post(url,{contentvar:cv},function(data){
		$(divid).html(data).show(); //report result from the ajaxfile, the data stores the information to be displayed from ajaxfile
		
		});
  }//end dialog display
 
 if(cv=='password_recovery')
  {
	  //alert('here'+cv);
	  $.post(url,{contentvar:cv},function(data){
	  $('#w').html(data).show();
	  $('#w').window('open');  //open the dialog to display info from ajax
	  });
  }//end of password recovery
 
 if(cv=='pass_recovery_update')
 {
	 //alert($("#passform").serialize()); exit;
	 var uname=$('#uname').val();
	 var email=$('#email').val();
	 if(uname=='' || email=='')
	  {
		  $.messager.alert('Error','Enter all the required information');$(divid).html('').show();exit;
	  }
	 $.post(url,$("#passform").serialize()+"&contentvar="+cv,function(data){  //ajaxfile/scriptfile_a is called undernith
	 $(divid).html(data).show(); //report result from the ajaxfile, the data stores the information to be displayed from ajaxfile
	 });
 } //end of update password recovery
  
if(cv=='open_dialog')
 {
	 var div_id="#"+v;
	  //$(div_id).window('close');
	  $(div_id).window('open');
 } //end of open dialog

if(cv=='close_dialog')
 {
	 var div_id="#"+v;
	  $(div_id).window('close');
	  //$(div_id).window('open');
 } //end of open dialog

if(cv=='button')
  {
	  var div_id="#"+v;
	  $(div_id).window('close');
	  //$(div_id).window('open');
  }
}  //swap content ends
 </script>
