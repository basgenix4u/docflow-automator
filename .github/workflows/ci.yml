name: DocFlow Automator CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_docflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install System Dependencies for Playwright & PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libasound2t64 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxkbcommon0 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0

      - name: Install Python Dependencies & Playwright Browsers
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          sudo playwright install-deps chromium || true

      - name: Run Backend Integration & Database Tests
        env:
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/test_docflow"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          DEBUG: "False"
          CORS_ORIGINS: "http://localhost:3000"
        run: |
          cd backend
          PYTHONPATH=. pytest tests -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build Next.js App
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
