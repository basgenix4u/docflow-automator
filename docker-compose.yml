version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=False
      - SECRET_KEY=docflow_production_secure_secret_key_2026
      - FUW_PORTAL_URL=https://ug.fuwportal.edu.ng/index.php
      - DEFAULT_DEMO_USERNAME=BSC/BCH/24/140
      - DEFAULT_DEMO_PASSWORD=Omotola
    volumes:
      - pdf_storage:/home/user/docflow-automator/storage/pdfs
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    restart: always

volumes:
  pdf_storage:
